[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "astrovox"
version = "1.0.0"
description = "Interactive 3D viewer for volumetric spectral cubes"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.24",
  "pyvista>=0.43",
  "astropy>=6",
  "imageio>=2.30",
  "imageio-ffmpeg>=0.4",
  "pyobjc-framework-Cocoa>=9; sys_platform == 'darwin'",
]

[project.scripts]
astrovox = "astrovox.gui:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
